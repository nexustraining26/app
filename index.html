<style>

button{cursor:pointer;border:0;background:none}

<body>
<div id="app"></div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://qqvtdznpmnkdglsldmrn.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g9CB66L6acALR7XKF1symA_19cNlJEY';
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => (s ?? '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DIAS = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const iso = d => { const x = new Date(d); x.setMinutes(x.getMinutes() - x.getTimezoneOffset()); return x.toISOString().slice(0,10); };
const hoje = () => iso(new Date());
const addDias = (s, n) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return iso(d); };
const segunda = s => { const d = new Date(s + 'T12:00:00'); const w = (d.getDay() + 6) % 7; d.setDate(d.getDate() - w); return iso(d); };
const fmt = s => { const d = new Date(s + 'T12:00:00'); return `${DIAS[d.getDay()]} ${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`; };
function toast(m){ const t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }
function erro(e){ console.error(e); toast('Erro: ' + (e?.message || e)); }

const S = { user:null, perfil:null, atleta:null, tab:null, dia:hoje(), semana:segunda(hoje()), alvo:null };

const ICON = {
  hoje:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>',
  hist:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>',
  crono:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg>',
  grupos:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5M15 15c3 0 6 1.5 6 4"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 13h3M13 13h3M8 17h3"/></svg>',
  sair:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>',
  sol:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  lua:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>'
};

// ---------- AUTH ----------
async function iniciar(){
  const { data:{ session } } = await sb.auth.getSession();
  S.user = session?.user || null;
  if (!S.user) return telaLogin();
  const { data:p } = await sb.from('perfis').select('*').eq('id', S.user.id).maybeSingle();
  S.perfil = p;
  if (p?.papel === 'coach') { S.tab = S.tab || 'cal'; return render(); }
  const { data:a } = await sb.from('atletas').select('*').eq('user_id', S.user.id).maybeSingle();
  S.atleta = a;
  S.tab = S.tab || 'hoje';
  render();
}
sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT') { S.user=null; S.perfil=null; S.atleta=null; S.tab=null; telaLogin(); } });

function telaLogin(modo='entrar'){
  app.innerHTML = `<div class="login">
    <div class="lock"><svg class="sym" viewBox="0 0 120 120" aria-hidden="true"><polygon points="60,10 103.3,35 103.3,85 60,110 16.7,85 16.7,35" fill="none" stroke="#7B2FF7" stroke-width="9" stroke-linejoin="round"/><path d="M26 66 C 36 66, 40 84, 52 82 C 66 80, 76 38, 103 33" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round"/><circle cx="104" cy="33" r="10" fill="#C4B5FD" stroke="#0A0A0F" stroke-width="4"/></svg><div><div class="nm">NEXUS</div><div class="tr">TRAINING</div></div></div>
    <p class="mut small" style="text-align:center;margin-bottom:22px">Treino com nexo.</p>
    <div class="seg"><button data-m="entrar" class="${modo==='entrar'?'on':''}">Entrar</button><button data-m="criar" class="${modo==='criar'?'on':''}">Criar conta</button></div>
    <label>E-mail</label><input id="em" type="email" autocomplete="email" inputmode="email">
    <label>Senha</label><input id="pw" type="password" autocomplete="${modo==='criar'?'new-password':'current-password'}">
    ${modo==='criar'?'<p class="mut small" style="margin-top:8px">Use o mesmo e-mail que você passou para o seu coach.</p>':''}
    <button class="btn" id="go" style="width:100%;margin-top:16px">${modo==='criar'?'Criar conta':'Entrar'}</button>
    ${modo==='entrar'?'<button class="mut small" id="esq" style="display:block;margin:14px auto 0">Esqueci minha senha</button>':''}
  </div>`;
  app.querySelectorAll('.seg button').forEach(b => b.onclick = () => telaLogin(b.dataset.m));
  $('#go').onclick = async () => {
    const email = $('#em').value.trim(), password = $('#pw').value;
    if (!email || !password) return toast('Preencha e-mail e senha');
    $('#go').disabled = true;
    const r = modo === 'criar' ? await sb.auth.signUp({ email, password }) : await sb.auth.signInWithPassword({ email, password });
    $('#go').disabled = false;
    if (r.error) return toast(traduz(r.error.message));
    if (modo === 'criar' && !r.data.session) return toast('Conta criada! Confirme pelo link no seu e-mail e depois entre.');
    iniciar();
  };
  const esq = $('#esq');
  if (esq) esq.onclick = async () => {
    const email = $('#em').value.trim(); if (!email) return toast('Digite seu e-mail acima');
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.href.split('#')[0] });
    toast(error ? traduz(error.message) : 'Enviamos um link para o seu e-mail');
  };
}
function traduz(m){
  if (/Invalid login/i.test(m)) return 'E-mail ou senha incorretos';
  if (/already registered/i.test(m)) return 'Esse e-mail já tem conta. Use "Entrar".';
  if (/at least 6/i.test(m)) return 'A senha precisa ter pelo menos 6 caracteres';
  if (/not confirmed/i.test(m)) return 'Confirme seu e-mail pelo link enviado antes de entrar';
  return m;
}

// ---------- ATLETA ----------
async function treinosDoAtleta(ini, fim){
  const { data:v } = await sb.from('grupo_atletas').select('grupo_id').eq('atleta_id', S.atleta.id);
  const gids = (v||[]).map(x=>x.grupo_id);
  const filtro = `atleta_id.eq.${S.atleta.id}` + (gids.length ? `,grupo_id.in.(${gids.join(',')})` : '');
  const { data, error } = await sb.from('treinos').select('*, blocos(*)').or(filtro).eq('publicado', true).gte('data', ini).lte('data', fim).order('data');
  if (error) throw error;
  const porDia = {};
  for (const t of data) (porDia[t.data] ||= []).push(t);
  for (const d in porDia) {
    const ind = porDia[d].filter(t => t.atleta_id);
    if (ind.some(t => t.substitui_grupo)) porDia[d] = ind;
    porDia[d].forEach(t => t.blocos.sort((a,b)=>a.ordem-b.ordem));
  }
  return porDia;
}

async function vHoje(m){
  if (!S.atleta) { m.innerHTML = `<div class="card"><h3>Conta ainda não liberada</h3><p class="mut">Seu e-mail (${esc(S.user.email)}) ainda não está cadastrado pelo seu coach. Avise o Nicolas para liberar seu acesso.</p></div>`; return; }
  if (S.treinoAberto) return vTreino(m);
  S.lista = S.lista || 'prox';
  const hj = hoje();
  m.innerHTML = `<div class="seg"><button data-l="prox" class="${S.lista==='prox'?'on':''}">Próximos<span class="cnt" id="nprox" hidden></span></button><button data-l="pass" class="${S.lista==='pass'?'on':''}">Passado</button></div><div id="lst"><p class="mut">Carregando…</p></div>`;
  m.querySelectorAll('[data-l]').forEach(b => b.onclick = () => { S.lista = b.dataset.l; vHoje(m); });
  let prox, pass, res;
  try {
    const [a, b] = await Promise.all([ treinosDoAtleta(hj, addDias(hj, 60)), treinosDoAtleta(addDias(hj, -90), addDias(hj, -1)) ]);
    prox = Object.values(a).flat().sort((x,y) => x.data.localeCompare(y.data) || x.id - y.id);
    pass = Object.values(b).flat().sort((x,y) => y.data.localeCompare(x.data) || x.id - y.id);
    const ids = [...prox, ...pass].flatMap(t => t.blocos.map(bl => bl.id));
    res = ids.length ? (await sb.from('resultados').select('bloco_id').in('bloco_id', ids).eq('atleta_id', S.atleta.id)).data || [] : [];
  } catch(e){ return erro(e); }
  const feitos = new Set(res.map(r => r.bloco_id));
  const nb = $('#nprox'); if (nb) { nb.textContent = prox.length; nb.hidden = !prox.length; }
  const lista = S.lista === 'prox' ? prox : pass;
  if (!lista.length) { $('#lst').innerHTML = `<div class="card"><p class="mut">${S.lista==='prox' ? 'Nenhum treino programado ainda. Descanso! 💤' : 'Nenhum treino nos últimos 90 dias.'}</p></div>`; return; }
  const MES = ['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];
  $('#lst').innerHTML = lista.map(t => {
    const dt = new Date(t.data + 'T12:00:00');
    const tit = t.blocos.map(b => b.titulo).filter(Boolean);
    const vis = tit.slice(0, 4), resto = tit.length - vis.length;
    const nFeitos = t.blocos.filter(b => feitos.has(b.id)).length;
    return `<button class="tcard" data-ab="${t.id}"><div class="dbadge ${t.data===hj?'hj':''} ${S.lista==='pass'?'pass':''}"><b>${dt.getDate()}</b><span>${MES[dt.getMonth()]}</span></div>
      <div style="flex:1;min-width:0"><div class="tt2">${esc(t.titulo || 'Treino')}</div><div class="chips">${vis.map(x => `<span class="chip">${esc(x)}</span>`).join('')}${resto > 0 ? `<span class="chip mais">+${resto}</span>` : ''}${nFeitos ? `<span class="chip ok">✓ ${nFeitos}/${t.blocos.length}</span>` : ''}</div></div></button>`;
  }).join('');
  $('#lst').querySelectorAll('[data-ab]').forEach(b => b.onclick = () => { S.treinoAberto = +b.dataset.ab; vHoje(m); window.scrollTo(0,0); });
}

async function vTreino(m){
  m.innerHTML = `<button class="btn sec sm" id="volta" style="margin-bottom:12px">‹ Voltar</button><div id="dia"><p class="mut">Carregando…</p></div>`;
  $('#volta').onclick = () => { S.treinoAberto = null; vHoje(m); };
  const { data:t0, error:e0 } = await sb.from('treinos').select('*, blocos(*)').eq('id', S.treinoAberto).maybeSingle();
  if (e0) return erro(e0);
  if (!t0) { S.treinoAberto = null; return vHoje(m); }
  t0.blocos.sort((a,b) => a.ordem - b.ordem);
  const ts = [t0];
  const ids = ts.flatMap(t => t.blocos.map(b => b.id));
  const { data:res } = ids.length ? await sb.from('resultados').select('*').in('bloco_id', ids).eq('atleta_id', S.atleta.id) : { data:[] };
  const rm = Object.fromEntries((res||[]).map(r => [r.bloco_id, r]));

    ${t.mindset?`<div class="mind"><div class="mh">🧠 Mindset</div><div class="pre">${esc(t.mindset)}</div></div>`:''}
    ${t.blocos.map((b,i) => { const r = rm[b.id]; return `<div class="ativ ${r?'feita':''}" id="at${b.id}"><div class="ah"><span class="num">${i+1}</span><h4>${esc(b.titulo)}</h4></div>
      <div class="pre ad">${esc(b.descricao)}</div>
      ${b.comentario?`<div class="pre mut small ac">${esc(b.comentario)}</div>`:''}
      ${b.video_url?`<div class="ac"><a class="small" style="color:var(--acc2)" href="${esc(b.video_url)}" target="_blank" rel="noopener">▶ Ver vídeo</a></div>`:''}
      <div class="res"><div class="row"><input placeholder="Carga, tempo ou reps" data-r="${b.id}" value="${esc(r?.resultado||'')}" style="flex:1"><button class="btn sm" data-s="${b.id}">${r?'✓':'Salvar'}</button></div>
      <input placeholder="Comentário (opcional)" data-c="${b.id}" value="${esc(r?.comentario||'')}" style="margin-top:6px"></div></div>`; }).join('')}`).join('');
  $('#dia').querySelectorAll('[data-s]').forEach(btn => btn.onclick = async () => {
    if (S.preview) return toast('Modo visualização: o atleta salva o resultado aqui');
    const id = +btn.dataset.s;
    const resultado = $(`[data-r="${id}"]`).value.trim(), comentario = $(`[data-c="${id}"]`).value.trim();

    btn.disabled = false;
    if (error) return erro(error);
    btn.textContent = '✓'; toast('Resultado salvo'); const at = $('#at' + id); if (at) at.classList.add('feita');
  });
}

async function vHist(m){
  if (!S.atleta) return vHoje(m);
  m.innerHTML = `<h2>Histórico</h2><input id="bus" placeholder="Buscar exercício (ex.: snatch, back squat)"><div id="lst" style="margin-top:12px"><p class="mut">Carregando…</p></div>`;
  const { data, error } = await sb.from('resultados').select('resultado, comentario, atualizado_em, blocos(titulo, descricao, treinos(data))').eq('atleta_id', S.atleta.id).order('atualizado_em', { ascending:false }).limit(300);
  if (error) return erro(error);
  const rows = data.filter(r => r.blocos).sort((a,b) => (b.blocos.treinos?.data||'').localeCompare(a.blocos.treinos?.data||''));
  const draw = q => { const f = q ? rows.filter(r => (r.blocos.titulo + ' ' + r.blocos.descricao).toLowerCase().includes(q.toLowerCase())) : rows;

// ---------- CRONÔMETRO ----------
const CR = { modo:'timer', rod:false, ini:0, acum:0, iv:null, cfg:{ timer:600, dir:'desc', trab:40, desc:20, rounds:8, emom:60, emomR:10, prep:10 } };
const campoTempo = (k, rot) => `<div class="tcampo"><label>${rot}</label><div class="mmss"><input type="number" inputmode="numeric" min="0" id="m_${k}" value="${Math.floor(CR.cfg[k]/60)}"><span>min</span><input type="number" inputmode="numeric" min="0" max="59" id="s_${k}" value="${CR.cfg[k]%60}"><span>s</span></div></div>`;
const campoNum = (k, rot) => `<div class="tcampo"><label>${rot}</label><input type="number" inputmode="numeric" min="1" id="n_${k}" value="${CR.cfg[k]}"></div>`;
let wake = null;
async function pedeWake(){ try { wake = await navigator.wakeLock?.request('screen'); } catch{} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && CR.rod && (!wake || wake.released)) pedeWake(); });
function bip(f=880, d=.15){ try { const c = bip.c ||= new (window.AudioContext||window.webkitAudioContext)(); const o=c.createOscillator(), g=c.createGain(); o.frequency.value=f; o.connect(g); g.connect(c.destination); g.gain.setValueAtTime(.3,c.currentTime); o.start(); o.stop(c.currentTime+d); } catch{} }
const mmss = s => { s = Math.max(0, Math.ceil(s)); return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; };
function vCrono(m){
  const c = CR.cfg;
  m.innerHTML = `<div class="seg">${[['timer','Timer'],['tabata','Intervalo'],['emom','EMOM']].map(([k,n])=>`<button data-k="${k}" class="${CR.modo===k?'on':''}">${n}</button>`).join('')}</div>
  <div class="card" id="crono">
    <div id="cfg">${CR.modo==='timer'?`<div class="tcampo" style="flex-basis:100%"><label>Contagem</label><div class="pseg">${[['desc','Decrescente ↓'],['asc','Crescente ↑']].map(([v,n])=>`<button data-d="${v}" class="${c.dir===v?'on':''}">${n}</button>`).join('')}</div></div>`+campoTempo('timer', c.dir==='asc'?'Time cap (0 = sem limite)':'Tempo'):''}
    ${CR.modo==='tabata'?campoTempo('trab','Trabalho')+campoTempo('desc','Descanso')+campoNum('rounds','Rounds'):''}
    ${CR.modo==='emom'?campoTempo('emom','A cada')+campoNum('emomR','Rounds'):''}
    <div class="tcampo" style="flex-basis:100%"><label>Contagem antes de começar</label><div class="pseg">${[[0,'Sem'],[5,'5 s'],[10,'10 s'],[15,'15 s']].map(([v,n])=>`<button data-p="${v}" class="${c.prep===v?'on':''}">${n}</button>`).join('')}</div></div></div>
    <div class="mut small" id="fase" style="text-align:center;margin-top:10px">&nbsp;</div>
    <div class="timer" id="tm">00:00</div>
    <div class="row" style="justify-content:center"><button class="btn" id="play" style="min-width:120px">${CR.rod?'Pausar':'Iniciar'}</button><button class="btn sec" id="zerar">Zerar</button></div>
  </div><p class="mut small" style="text-align:center">A tela fica acesa enquanto o cronômetro roda.</p>`;
  m.querySelectorAll('.seg button').forEach(b => b.onclick = () => { parar(); CR.acum=0; CR.modo=b.dataset.k; vCrono(m); });
  m.querySelectorAll('#cfg input').forEach(i => i.oninput = () => {
    const k = i.id.slice(2);
    if (i.id[0] === 'n') c[k] = Math.max(1, Math.floor(+i.value || 1));
    else { const mi = Math.max(0, Math.floor(+$('#m_'+k).value || 0)), se = Math.max(0, Math.floor(+$('#s_'+k).value || 0)); c[k] = Math.max(k==='timer' && c.dir==='asc' ? 0 : 1, mi*60 + se); }
    if (!CR.rod && !CR.acum) tick();
  });
  m.querySelectorAll('#cfg input[id^="s_"]').forEach(i => i.onchange = () => { const k = i.id.slice(2); $('#m_'+k).value = Math.floor(c[k]/60); i.value = c[k]%60; });
  m.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { c.prep = +b.dataset.p; m.querySelectorAll('[data-p]').forEach(x => x.classList.toggle('on', x === b)); });
  m.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { c.dir = b.dataset.d; if (c.dir === 'desc' && c.timer < 1) c.timer = 600; parar(); CR.acum = 0; vCrono(m); });
  $('#play').onclick = () => { if (CR.rod) { CR.acum += (Date.now()-CR.ini)/1000; parar(); } else { if (CR.acum === 0 && c.prep > 0) { CR.acum = -c.prep; CR.ultPrep = null; } CR.rod=true; CR.ini=Date.now(); pedeWake(); CR.iv=setInterval(tick,200); bip(660); } $('#play').textContent = CR.rod?'Pausar':'Iniciar'; };
  $('#zerar').onclick = () => { parar(); CR.acum=0; CR.ult=null; tick(); $('#play').textContent='Iniciar'; };
  tick();
}
function parar(){ CR.rod=false; clearInterval(CR.iv); try{ wake?.release(); }catch{} wake=null; }
function tick(){
  const el = $('#tm'); if (!el) return;
  const t = CR.acum + (CR.rod ? (Date.now()-CR.ini)/1000 : 0), c = CR.cfg; let txt, fase = '';
  const prep = t < 0;
  if (CR.ultPrep != null && !prep) { if (CR.rod) bip(990,.45); CR.ultPrep = null; }
  if (prep) { const s = Math.ceil(-t); txt = String(s); fase = 'Prepare-se'; if (CR.ultPrep !== s) { if (CR.rod && s <= 3) bip(660); CR.ultPrep = s; } }
  else if (CR.modo==='timer' && c.dir==='asc') { const cap = c.timer > 0 && t >= c.timer; txt = mmss(Math.floor(cap ? c.timer : t)); if (cap && CR.rod){ CR.acum=c.timer; parar(); bip(440,.6); } if (cap && CR.acum) fase='Fim!'; }
  else if (CR.modo==='timer') { const r = c.timer - t; txt = mmss(r); if (r<=0 && CR.rod){ CR.acum=t; parar(); bip(440,.6); } if (r<=0 && CR.acum) fase='Fim!'; }
  else if (CR.modo==='tabata') { const ciclo=c.trab+c.desc, n=Math.floor(t/ciclo); if (n>=c.rounds){ txt='00:00'; fase='Fim!'; if(CR.rod){CR.acum=t;parar();bip(440,.6);} } else { const p=t%ciclo, tr=p<c.trab; txt=mmss(tr?c.trab-p:ciclo-p); fase=`Round ${n+1}/${c.rounds} · ${tr?'TRABALHO':'descanso'}`; const k=n+'-'+tr; if(CR.ult!==k){ if(CR.rod&&CR.ult) bip(tr?880:520); CR.ult=k; } } }
  else { const n=Math.floor(t/c.emom); if (n>=c.emomR){ txt='00:00'; fase='Fim!'; if(CR.rod){CR.acum=t;parar();bip(440,.6);} } else { txt=mmss(c.emom - t%c.emom); fase=`Minuto ${n+1}/${c.emomR}`; if(CR.ult!==n){ if(CR.rod&&CR.ult!=null) bip(880); CR.ult=n; } } }
  el.textContent = txt; el.classList.toggle('go', CR.rod && !prep); el.classList.toggle('prep', prep); const f=$('#fase'); if (f) f.innerHTML = fase || '&nbsp;';
  const cx = $('#crono'); if (cx) cx.classList.toggle('ativo', CR.rod || CR.acum !== 0); const sg = $('#main .seg'); if (sg) sg.classList.toggle('hide', CR.rod || CR.acum !== 0);
  const pl=$('#play'); if (pl && !CR.rod) pl.textContent='Iniciar';
}

// ---------- ATUALIZAÇÃO AUTOMÁTICA ----------
const VERSAO = document.querySelector('meta[name=versao]')?.content || '';
async function checaVersao(){
  try {
    if (CR.rod || document.querySelector('.modal') || ['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)) return;
    const h = await (await fetch('index.html?x=' + Date.now(), { cache:'no-store' })).text();
    const nova = (h.match(/<meta name="versao" content="([^"]+)"/) || [])[1];
    if (!nova || nova === VERSAO) return;
    if (sessionStorage.getItem('tentouVersao') === nova) return;
    sessionStorage.setItem('tentouVersao', nova);
    location.replace(location.pathname + '?v=' + encodeURIComponent(nova));
  } catch {}
}
checaVersao();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checaVersao(); });

let CACHE = { grupos:[], atletas:[], vinc:[] };
async function carregaBase(){
  const [g,a,v] = await Promise.all([ sb.from('grupos').select('*').order('nome'), sb.from('atletas').select('*').order('nome'), sb.from('grupo_atletas').select('*') ]);
  if (g.error||a.error||v.error) throw (g.error||a.error||v.error);
  CACHE = { grupos:g.data, atletas:a.data, vinc:v.data };
}

const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const DIASC = ['DOM','SEG','TER','QUA','QUI','SEX','SAB'];
const domingo = s => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() - d.getDay()); return iso(d); };
async function vCal(m){
  m.innerHTML = '<p class="mut">Carregando…</p>';
  try { await carregaBase(); } catch(e){ return erro(e); }
  if (!S.alvo && CACHE.grupos[0]) S.alvo = 'g:' + CACHE.grupos[0].id;
  S.modo = S.modo || 'mes';
  S.ref = S.ref || hoje();
  const opts = `<optgroup label="Grupos">${CACHE.grupos.map(g=>`<option value="g:${g.id}" ${S.alvo==='g:'+g.id?'selected':''}>${esc(g.nome)}</option>`).join('')}</optgroup><optgroup label="Individual">${CACHE.atletas.filter(a=>a.ativo).map(a=>`<option value="a:${a.id}" ${S.alvo==='a:'+a.id?'selected':''}>${esc(a.nome)}</option>`).join('')}</optgroup>`;
  const ref = new Date(S.ref + 'T12:00:00');
  let ini, fim, rotulo;
  if (S.modo === 'mes') { const p = iso(new Date(ref.getFullYear(), ref.getMonth(), 1, 12)); const u = iso(new Date(ref.getFullYear(), ref.getMonth()+1, 0, 12)); ini = domingo(p); fim = addDias(domingo(u), 6); rotulo = `${MESES[ref.getMonth()]} ${ref.getFullYear()}`; }
  else { ini = domingo(S.ref); fim = addDias(ini, 6); rotulo = `${fmt(ini).slice(4)} – ${fmt(fim).slice(4)}`; }
  const nomeAlvo = S.alvo ? (S.alvo[0]==='g' ? CACHE.grupos.find(g=>'g:'+g.id===S.alvo)?.nome : CACHE.atletas.find(a=>'a:'+a.id===S.alvo)?.nome) || '' : '';
  const sig = nomeAlvo.split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase();
  m.innerHTML = `<div class="chead"><div class="av">${esc(sig||'N')}</div><select id="alvo">${opts}</select>
    <div class="mnav"><button id="ant">‹</button><b>${esc(rotulo)}</b><button id="prx">›</button></div></div>
  <div class="row" style="margin-bottom:10px"><div class="seg sm"><button data-md="semana" class="${S.modo==='semana'?'on':''}">SEMANA</button><button data-md="mes" class="${S.modo==='mes'?'on':''}">MÊS</button></div><div class="sp"></div><button class="btn sec sm" id="hj">Hoje</button><button class="btn sec sm" id="cp">Copiar semana…</button>${CACHE.grupos.some(g=>g.cc_id)?'<button class="btn sec sm" id="sync" title="Trazer treinos do Coach Control">↻ CC</button>':''}</div>
  <div id="cal"><p class="mut">Carregando treinos…</p></div>`;
  if (!CACHE.grupos.length) { $('#cal').innerHTML = '<div class="card"><p class="mut">Crie um grupo na aba Atletas para começar.</p></div>'; }
  $('#alvo').onchange = e => { S.alvo = e.target.value; vCal(m); };
  const passo = (n) => { const d = new Date(S.ref + 'T12:00:00'); if (S.modo==='mes') { d.setDate(1); d.setMonth(d.getMonth()+n); } else d.setDate(d.getDate()+7*n); S.ref = iso(d); vCal(m); };
  $('#ant').onclick = () => passo(-1); $('#prx').onclick = () => passo(1);
  $('#hj').onclick = () => { S.ref = hoje(); vCal(m); };
  m.querySelectorAll('[data-md]').forEach(b => b.onclick = () => { S.modo = b.dataset.md; vCal(m); });
  $('#cp').onclick = () => { S.semana = domingo(S.ref); copiarSemana(m); };
  const sy = $('#sync'); if (sy) sy.onclick = () => telaSyncCC(m, ini, fim);
  if (!S.alvo) return;
  const [tipo, id] = S.alvo.split(':');
  const q = sb.from('treinos').select('*, blocos(id,titulo,ordem)').gte('data',ini).lte('data',fim).order('id');
  const { data, error } = await (tipo==='g' ? q.eq('grupo_id', id) : q.eq('atleta_id', id));
  if (error) return erro(error);
  let grupoDoAtleta = [];
  if (tipo==='a') { const gids = CACHE.vinc.filter(v=>v.atleta_id===id).map(v=>v.grupo_id); if (gids.length) { const r = await sb.from('treinos').select('id,data,titulo,grupo_id,blocos(titulo,ordem)').in('grupo_id',gids).gte('data',ini).lte('data',fim); grupoDoAtleta = r.data||[]; } }
  const cal = $('#cal'); if (!cal) return;
  const mesRef = ref.getMonth(), hj = hoje();
  const nDias = Math.round((new Date(fim) - new Date(ini)) / 864e5) + 1;
  let html = DIASC.map(d=>`<div class="wd">${d}</div>`).join('');
  for (let w = 0; w < nDias; w += 7) {
    const dias = [...Array(7)].map((_,i)=>addDias(ini, w+i));
    html += dias.map(d => { const dt = new Date(d+'T12:00:00'); const fora = S.modo==='mes' && dt.getMonth()!==mesRef; return `<div class="dn ${fora?'fora':''} ${d===hj?'hj':''}"><span>${String(dt.getDate()).padStart(2,'0')}</span><button data-novo="${d}" title="Novo treino">＋</button></div>`; }).join('');
    html += dias.map(d => { const dt = new Date(d+'T12:00:00'); const fora = S.modo==='mes' && dt.getMonth()!==mesRef;
      const ts = data.filter(t=>t.data===d), gs = grupoDoAtleta.filter(t=>t.data===d);
      return `<div class="cell ${fora?'fora':''}" data-vazio="${d}">${ts.map(t=>`<button class="tc ${tipo==='a'?'ind':''}" data-t="${t.id}"><div class="tt">${esc(t.titulo||'Treino')}</div><div class="bl">${t.blocos.sort((a,b)=>a.ordem-b.ordem).map(b=>esc(b.titulo)).join('<br>')}</div><span class="mais">•••</span></button>`).join('')}
        ${gs.map(t=>`<button class="tc grp" data-ind="${t.id}" title="Treino do grupo – toque para ajustar só para este atleta"><div class="tt">${esc(CACHE.grupos.find(g=>g.id===t.grupo_id)?.nome||'Grupo')}</div><div class="bl">${(t.blocos||[]).sort((a,b)=>a.ordem-b.ordem).map(b=>esc(b.titulo)).join('<br>')}</div></button>`).join('')}</div>`; }).join('');
  }
  cal.innerHTML = `<div class="mcal ${S.modo==='semana'?'sem':''}">${html}</div><p class="mut small" style="margin-top:8px">Toque num treino para editar. Use ＋ na faixa do dia para criar.${tipo==='a'?' Cards tracejados são do grupo: toque para ajustar só para este atleta.':''}</p>`;
  const novo = d => editor({ data:d, titulo:'', blocos:[{titulo:'',descricao:'',comentario:''}], [tipo==='g'?'grupo_id':'atleta_id']: tipo==='g'?+id:id }, m);
  cal.querySelectorAll('[data-novo]').forEach(b => b.onclick = e => { e.stopPropagation(); novo(b.dataset.novo); });
  cal.querySelectorAll('.cell').forEach(c => c.onclick = e => { if (e.target === c && !c.querySelector('.tc')) novo(c.dataset.vazio); });
  cal.querySelectorAll('[data-t]').forEach(b => b.onclick = async () => { const { data:t, error } = await sb.from('treinos').select('*, blocos(*)').eq('id', b.dataset.t).single(); if (error) return erro(error); t.blocos.sort((a,b)=>a.ordem-b.ordem); editor(t, m); });
  cal.querySelectorAll('[data-ind]').forEach(b => b.onclick = async () => { const { data:t } = await sb.from('treinos').select('*, blocos(*)').eq('id', b.dataset.ind).single(); t.blocos.sort((a,b)=>a.ordem-b.ordem);
    editor({ data:t.data, titulo:t.titulo, atleta_id:id, substitui_grupo:true, blocos:t.blocos.map(({titulo,descricao,comentario,video_url})=>({titulo,descricao,comentario,video_url})) }, m); });
}

function editor(t, m){
  const md = document.createElement('div'); md.className='modal';
  const alvoNome = t.grupo_id ? CACHE.grupos.find(g=>g.id===t.grupo_id)?.nome : CACHE.atletas.find(a=>a.id===t.atleta_id)?.nome;
  const draw = () => {
    md.innerHTML = `<div class="box"><div class="row"><h2 style="margin:0">${t.id?'Editar':'Novo'} treino</h2><div class="sp"></div><button class="btn sec sm" id="x">Fechar</button></div>
    <p class="mut small">${esc(alvoNome||'')}</p>
    <div class="row"><div style="flex:1"><label>Data</label><input type="date" id="dt" value="${t.data}"></div><div style="flex:2"><label>Título</label><input id="tt" value="${esc(t.titulo)}" placeholder="Ex.: SEGUNDA – Força + Snatch"></div></div>
    <label>🧠 Mindset (aparece no topo do treino)</label><textarea id="mind" style="min-height:70px" placeholder="Ex.: Hoje o foco é qualidade de movimento. Carga é consequência.">${esc(t.mindset||'')}</textarea>
    ${t.atleta_id?`<label style="text-transform:none;letter-spacing:0;font-size:14px;color:var(--txt);margin-top:12px"><input type="checkbox" id="sub" style="width:auto;margin-right:8px" ${t.substitui_grupo?'checked':''}>Substituir o treino do grupo neste dia (o atleta só vê este)</label>`:''}
    <div id="bls">${t.blocos.map((b,i)=>`<div class="blk"><div class="row"><span class="mut small">Bloco ${i+1}</span><div class="sp"></div>
      <button class="btn sec sm" data-up="${i}" ${i?'':'disabled'}>↑</button><button class="btn sec sm" data-dn="${i}" ${i<t.blocos.length-1?'':'disabled'}>↓</button><button class="btn dan sm" data-rm="${i}">Remover</button></div>
      <label>Título da atividade</label><input data-f="titulo" data-i="${i}" value="${esc(b.titulo)}">
      <label>Descrição</label><textarea data-f="descricao" data-i="${i}">${esc(b.descricao)}</textarea>
      <label>Observação</label><textarea data-f="comentario" data-i="${i}" style="min-height:60px">${esc(b.comentario)}</textarea>
      <label>Link do vídeo (opcional)</label><input data-f="video_url" data-i="${i}" value="${esc(b.video_url||'')}" placeholder="https://youtube.com/…"></div>`).join('')}</div>
    <button class="btn sec" id="add" style="width:100%">＋ Adicionar bloco</button>
    <div class="row" style="margin-top:16px"><button class="btn" id="salvar" style="flex:1">Salvar e publicar</button>${t.id?'<button class="btn sec" id="dup">Duplicar…</button><button class="btn sec" id="ver">Resultados</button><button class="btn dan" id="del">Apagar</button>':''}</div></div>`;
    const sync = () => { md.querySelectorAll('[data-f]').forEach(e => t.blocos[+e.dataset.i][e.dataset.f] = e.value); t.data = $('#dt').value; t.titulo = $('#tt').value; t.mindset = $('#mind').value; const s=md.querySelector('#sub'); if (s) t.substitui_grupo = s.checked; };
    md.querySelector('#x').onclick = () => md.remove();
    md.querySelector('#add').onclick = () => { sync(); t.blocos.push({titulo:'',descricao:'',comentario:''}); draw(); };
    md.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { sync(); t.blocos.splice(+b.dataset.rm,1); draw(); });
    md.querySelectorAll('[data-up]').forEach(b => b.onclick = () => { sync(); const i=+b.dataset.up; [t.blocos[i-1],t.blocos[i]]=[t.blocos[i],t.blocos[i-1]]; draw(); });
    md.querySelectorAll('[data-dn]').forEach(b => b.onclick = () => { sync(); const i=+b.dataset.dn; [t.blocos[i+1],t.blocos[i]]=[t.blocos[i],t.blocos[i+1]]; draw(); });
    md.querySelector('#salvar').onclick = async () => { sync(); try { await salvarTreino(t); toast('Treino publicado'); md.remove(); vCal(m); } catch(e){ erro(e); } };
    const del = md.querySelector('#del'); if (del) del.onclick = async () => { if (!confirm('Apagar este treino e os resultados dos atletas nele?')) return; const { error } = await sb.from('treinos').delete().eq('id', t.id); if (error) return erro(error); md.remove(); vCal(m); };
    const dup = md.querySelector('#dup'); if (dup) dup.onclick = async () => { sync(); const nd = prompt('Duplicar para qual data? (AAAA-MM-DD)', addDias(t.data,7)); if (!nd) return; try { await salvarTreino({ ...t, id:null, data:nd, blocos:t.blocos.map(({titulo,descricao,comentario,video_url})=>({titulo,descricao,comentario,video_url})) }); toast('Duplicado'); md.remove(); vCal(m); } catch(e){ erro(e); } };
    const ver = md.querySelector('#ver'); if (ver) ver.onclick = () => resultados(t);
  };
  draw(); document.body.appendChild(md);
}

async function salvarTreino(t){
  const row = { data:t.data, titulo:t.titulo||'', mindset:(t.mindset||'').trim() || null, grupo_id:t.grupo_id||null, atleta_id:t.atleta_id||null, substitui_grupo:!!t.substitui_grupo, publicado:true };
  let id = t.id;
  if (id) { const { error } = await sb.from('treinos').update(row).eq('id', id); if (error) throw error; }
  else { const { data, error } = await sb.from('treinos').insert(row).select('id').single(); if (error) throw error; id = data.id; }
  const bl = t.blocos.filter(b => (b.titulo||b.descricao||'').trim()).map(b => ({ id: t.id ? b.id : undefined, titulo:b.titulo||'', descricao:b.descricao||'', comentario:b.comentario||'', video_url:b.video_url||null }));
  await salvarBlocos(id, bl, !!t.id);
  return id;
}

// Atualiza os blocos sem apagar os que continuam (assim os resultados dos atletas não se perdem).
async function salvarBlocos(treinoId, blocos, existe){
  let antigos = [];
  if (existe) { const r = await sb.from('blocos').select('id,ordem').eq('treino_id', treinoId).order('ordem'); if (r.error) throw r.error; antigos = r.data; }
  const usados = new Set();
  const novos = [];
  for (let i = 0; i < blocos.length; i++) {
    const b = blocos[i];
    const alvo = b.id ? antigos.find(a => a.id === b.id) : (blocos.some(x => x.id) ? null : antigos.find(a => a.ordem === i && !usados.has(a.id)));
    const row = { ordem:i, titulo:b.titulo||'', descricao:b.descricao||'', comentario:b.comentario||'', video_url:b.video_url||null };
    if (alvo) { usados.add(alvo.id); const { error } = await sb.from('blocos').update(row).eq('id', alvo.id); if (error) throw error; }
    else novos.push({ treino_id:treinoId, ...row });
  }
  const sobra = antigos.filter(a => !usados.has(a.id)).map(a => a.id);
  if (sobra.length) { const { error } = await sb.from('blocos').delete().in('id', sobra); if (error) throw error; }
  if (novos.length) { const { error } = await sb.from('blocos').insert(novos); if (error) throw error; }
}

// ---------- SINCRONIZAR COM O COACH CONTROL ----------
const CC_API = 'https://api.coachcontrol.com.br/';
function ccSessao(){ try { return JSON.parse(sessionStorage.getItem('cc') || 'null'); } catch { return null; } }
async function ccLogin(email, senha){
  const r = await fetch(CC_API + 'login', { method:'POST', headers:{ 'Content-Type':'application/json', Accept:'application/json' }, body: JSON.stringify({ email, senha, tipo:'C', plataforma:'Desktop', tokenNotificacao:null }) });
  if (!r.ok) throw new Error(r.status === 401 || r.status === 400 ? 'E-mail ou senha do Coach Control incorretos' : 'Coach Control respondeu ' + r.status);
  const j = await r.json();
  const u = j.usuario?.token ? j.usuario : j;
  const token = u.token, coach = u.usuario?.id ?? u.id;
  if (!token || !coach) throw new Error('Login no Coach Control não retornou o acesso esperado');
  const s = { token, coach }; try { sessionStorage.setItem('cc', JSON.stringify(s)); } catch {}
  return s;
}
async function ccTreinosGrupo(s, idgrupo, ini, fim){
  const r = await fetch(CC_API + 'grupoTreino/getByCoachAndAlunoAndDtInicialAndDtFinal', { method:'POST', headers:{ 'Content-Type':'application/json', Accept:'application/json', Authorization:'Bearer ' + s.token }, body: JSON.stringify({ idcoach:String(s.coach), idgrupo:String(idgrupo), dataInicial:ini, dataFinal:fim }) });
  if (r.status === 401 || r.status === 403) { try { sessionStorage.removeItem('cc'); } catch {} throw new Error('Acesso ao Coach Control expirou. Entre de novo.'); }
  if (!r.ok) throw new Error('Coach Control respondeu ' + r.status);
  return (await r.json()).grupoTreinos || [];
}
async function sincronizarCC(s, ini, fim, log){
  const grupos = CACHE.grupos.filter(g => g.cc_id);
  if (!grupos.length) throw new Error('Nenhum grupo ligado ao Coach Control');
  const tot = { novos:0, atualizados:0, iguais:0 };
  for (const g of grupos) {
    log(`Lendo ${g.nome} no Coach Control…`);
    const lista = await ccTreinosGrupo(s, g.cc_id, ini, fim);
    const ids = lista.map(t => t.id);
    const ex = ids.length ? await sb.from('treinos').select('id,cc_id,data,titulo,blocos(id,ordem,titulo,descricao,video_url)').in('cc_id', ids) : { data:[] };
    if (ex.error) throw ex.error;
    for (const t of lista) {
      const bl = (t.grupoAtividade || []).sort((a,b) => a.ordem - b.ordem).map(a => ({ titulo:a.titulo||'', descricao:a.descricao||'', comentario:'', video_url:a.link_video || a.bibliotecaVideo?.link || a.bibliotecaVideo?.link_video || null }));
      const atual = ex.data.find(x => x.cc_id === t.id);
      if (!atual) {
        const r = await sb.from('treinos').insert({ data:t.data, titulo:t.descricao||'', grupo_id:g.id, atleta_id:null, substitui_grupo:false, publicado:true, cc_id:t.id }).select('id').single();
        if (r.error) throw r.error;
        await salvarBlocos(r.data.id, bl, false); tot.novos++; continue;
      }
      const velhos = (atual.blocos || []).sort((a,b) => a.ordem - b.ordem);
      const igual = atual.data === t.data && atual.titulo === (t.descricao||'') && velhos.length === bl.length && bl.every((b,i) => velhos[i].titulo === b.titulo && velhos[i].descricao === b.descricao && (velhos[i].video_url||null) === b.video_url);
      if (igual) { tot.iguais++; continue; }
      const u = await sb.from('treinos').update({ data:t.data, titulo:t.descricao||'' }).eq('id', atual.id); if (u.error) throw u.error;
      await salvarBlocos(atual.id, bl, true); tot.atualizados++;
    }
  }
  return tot;
}
function telaSyncCC(m, ini, fim){
  const md = document.createElement('div'); md.className = 'modal';
  const draw = () => {
    const s = ccSessao();
    md.innerHTML = `<div class="box"><div class="row"><h2 style="margin:0">Sincronizar com o CC</h2><div class="sp"></div><button class="btn sec sm" id="x">Fechar</button></div>
      <p class="mut small">Traz do Coach Control os treinos dos grupos ligados (${esc(CACHE.grupos.filter(g=>g.cc_id).map(g=>g.nome).join(', ') || 'nenhum')}) de <b>${fmt(ini)}</b> a <b>${fmt(fim)}</b>. Só lê do CC, não muda nada lá. Treinos já trazidos são atualizados sem apagar os resultados dos atletas.</p>
      ${s ? '' : `<label>E-mail do Coach Control</label><input id="cce" type="email" autocomplete="username"><label>Senha do Coach Control</label><input id="ccp" type="password" autocomplete="current-password"><p class="mut small" style="margin-top:6px">A senha vai direto para o Coach Control e não fica salva. O acesso vale até você fechar o app.</p>`}
      <button class="btn" id="go" style="width:100%;margin-top:14px">Sincronizar</button>
      ${s ? '<button class="mut small" id="sair" style="display:block;margin:12px auto 0">Usar outra conta do CC</button>' : ''}
      <div id="lg" class="mut small" style="margin-top:12px"></div></div>`;
    md.querySelector('#x').onclick = () => md.remove();
    const sair = md.querySelector('#sair'); if (sair) sair.onclick = () => { try { sessionStorage.removeItem('cc'); } catch {} draw(); };
    const lg = md.querySelector('#lg'); const log = t => lg.textContent = t;
    md.querySelector('#go').onclick = async (e) => {
      e.target.disabled = true;
      try {
        let ss = ccSessao();
        if (!ss) { const em = md.querySelector('#cce').value.trim(), pw = md.querySelector('#ccp').value; if (!em || !pw) { e.target.disabled = false; return log('Preencha e-mail e senha do Coach Control.'); } log('Entrando no Coach Control…'); ss = await ccLogin(em, pw); }
        const r = await sincronizarCC(ss, ini, fim, log);
        toast('Sincronizado com o CC');
        md.remove(); vCal(m);
        setTimeout(() => toast(`${r.novos} novo(s), ${r.atualizados} atualizado(s), ${r.iguais} sem mudança`), 300);
      } catch(err) { e.target.disabled = false; log('Erro: ' + (err?.message || err)); if (!ccSessao()) draw(); }
    };
  };
  draw(); document.body.appendChild(md);
}

async function resultados(t){
  const md = document.createElement('div'); md.className='modal';
  md.innerHTML = `<div class="box"><div class="row"><h2 style="margin:0">Resultados</h2><div class="sp"></div><button class="btn sec sm" id="x">Fechar</button></div><p class="mut small">${fmt(t.data)} · ${esc(t.titulo)}</p><div id="rs"><p class="mut">Carregando…</p></div></div>`;
  document.body.appendChild(md); md.querySelector('#x').onclick = () => md.remove();
  const { data:bl } = await sb.from('blocos').select('id,titulo,ordem').eq('treino_id', t.id).order('ordem');
  const { data:rs, error } = await sb.from('resultados').select('*, atletas(nome)').in('bloco_id', (bl||[]).map(b=>b.id));
  if (error) return erro(error);
  md.querySelector('#rs').innerHTML = (bl||[]).map(b => { const r = rs.filter(x=>x.bloco_id===b.id); return `<div class="card"><h3>${esc(b.titulo)}</h3>${r.length?`<div class="list">${r.map(x=>`<div class="it"><div style="flex:1"><b>${esc(x.atletas?.nome)}</b><div>${esc(x.resultado||'✓')}</div>${x.comentario?`<div class="mut small">${esc(x.comentario)}</div>`:''}</div></div>`).join('')}</div>`:'<p class="mut small">Ninguém registrou ainda.</p>'}</div>`; }).join('') || '<p class="mut">Sem blocos.</p>';
}

async function copiarSemana(m){
  if (!S.alvo) return;
  const de = prompt('Copiar a semana que começa em (domingo, AAAA-MM-DD):', addDias(S.semana,-7)); if (!de) return;
  const para = prompt('Para a semana que começa em (domingo, AAAA-MM-DD):', S.semana); if (!para) return;
  const [tipo,id] = S.alvo.split(':'); const q = sb.from('treinos').select('*, blocos(*)').gte('data', domingo(de)).lte('data', addDias(domingo(de),6));
  const { data, error } = await (tipo==='g' ? q.eq('grupo_id', id) : q.eq('atleta_id', id)); if (error) return erro(error);
  if (!data.length) return toast('Nada para copiar nessa semana');
  const delta = Math.round((new Date(domingo(para)) - new Date(domingo(de))) / 864e5);
  try { for (const t of data) { t.blocos.sort((a,b)=>a.ordem-b.ordem); await salvarTreino({ ...t, id:null, data:addDias(t.data, delta) }); } toast(`${data.length} treino(s) copiados`); S.ref = domingo(para); S.modo = 'semana'; vCal(m); } catch(e){ erro(e); }
}

// ---------- COACH: GRUPOS E ATLETAS ----------
async function vGrupos(m){
  m.innerHTML = '<p class="mut">Carregando…</p>';
  try { await carregaBase(); } catch(e){ return erro(e); }
  const nGrupo = gid => CACHE.vinc.filter(v=>v.grupo_id===gid).length;
  m.innerHTML = `<h2>Grupos</h2><div class="card list">${CACHE.grupos.map(g=>`<div class="it"><div style="flex:1"><b>${esc(g.nome)}</b> <span class="mut small">${nGrupo(g.id)} atletas</span></div><button class="btn sec sm" data-rg="${g.id}">Renomear</button></div>`).join('') || '<p class="mut">Nenhum grupo ainda.</p>'}
    <div class="row" style="margin-top:10px"><input id="ng" placeholder="Nome do novo grupo" style="flex:1"><button class="btn" id="cg">Criar</button></div></div>
  <h2>Atletas</h2><input id="ba" placeholder="Buscar atleta" style="margin-bottom:10px"><div class="card list" id="la"></div>
  <div class="card"><h3>Novo atleta</h3><label>Nome</label><input id="an"><label>E-mail (o atleta cria a conta com esse e-mail)</label><input id="ae" type="email">
    <label>Grupos</label><div class="row">${CACHE.grupos.map(g=>`<label style="text-transform:none;letter-spacing:0;font-size:14px;color:var(--txt);margin:0"><input type="checkbox" class="ag" value="${g.id}" style="width:auto;margin-right:4px">${esc(g.nome)}</label>`).join('')}</div>
    <button class="btn" id="ca" style="margin-top:12px">Cadastrar atleta</button></div>`;
  const drawA = q => { const f = CACHE.atletas.filter(a => !q || a.nome.toLowerCase().includes(q.toLowerCase()));
    $('#la').innerHTML = f.map(a => `<div class="it"><div style="flex:1"><b style="${a.ativo?'':'opacity:.5'}">${esc(a.nome)}</b><div class="mut small">${esc(a.email||'sem e-mail')} · ${a.user_id?'<span class="ok">conta ativa</span>':'sem conta ainda'} · ${CACHE.vinc.filter(v=>v.atleta_id===a.id).map(v=>esc(CACHE.grupos.find(g=>g.id===v.grupo_id)?.nome)).join(', ')||'sem grupo'}</div></div><button class="btn sec sm" data-pv="${a.id}" title="Ver como atleta">👁</button><button class="btn sec sm" data-ea="${a.id}">Editar</button></div>`).join('') || '<p class="mut">Nenhum atleta.</p>';
    $('#la').querySelectorAll('[data-ea]').forEach(b => b.onclick = () => editarAtleta(CACHE.atletas.find(a=>a.id===b.dataset.ea), m));
    $('#la').querySelectorAll('[data-pv]').forEach(b => b.onclick = () => { S.preview = true; S.atleta = CACHE.atletas.find(a=>a.id===b.dataset.pv); S.tab = 'hoje'; S.dia = hoje(); S.semana = segunda(hoje()); render(); }); };
  drawA(''); $('#ba').oninput = e => drawA(e.target.value);
  $('#cg').onclick = async () => { const nome = $('#ng').value.trim(); if (!nome) return; const { error } = await sb.from('grupos').insert({ nome }); if (error) return erro(error); vGrupos(m); };
  m.querySelectorAll('[data-rg]').forEach(b => b.onclick = async () => { const g = CACHE.grupos.find(x=>x.id===+b.dataset.rg); const nome = prompt('Novo nome do grupo', g.nome); if (!nome) return; const { error } = await sb.from('grupos').update({ nome }).eq('id', g.id); if (error) return erro(error); vGrupos(m); });
  $('#ca').onclick = async () => { const nome = $('#an').value.trim(), email = $('#ae').value.trim().toLowerCase() || null; if (!nome) return toast('Coloque o nome');
    const { data, error } = await sb.from('atletas').insert({ nome, email }).select('id').single(); if (error) return erro(error);
    const gs = [...m.querySelectorAll('.ag:checked')].map(c => ({ grupo_id:+c.value, atleta_id:data.id }));
    if (gs.length) { const r = await sb.from('grupo_atletas').insert(gs); if (r.error) return erro(r.error); }
    toast('Atleta cadastrado'); vGrupos(m); };
}

function editarAtleta(a, m){
  const md = document.createElement('div'); md.className='modal';
  const meus = CACHE.vinc.filter(v=>v.atleta_id===a.id).map(v=>v.grupo_id);
  md.innerHTML = `<div class="box"><div class="row"><h2 style="margin:0">${esc(a.nome)}</h2><div class="sp"></div><button class="btn sec sm" id="x">Fechar</button></div>
    <label>Nome</label><input id="n" value="${esc(a.nome)}"><label>E-mail</label><input id="e" value="${esc(a.email||'')}" ${a.user_id?'disabled':''}>
    ${a.user_id?'<p class="mut small" style="margin-top:4px">Conta já criada – o e-mail não pode mais ser trocado aqui.</p>':''}
    <label>Grupos</label><div class="row">${CACHE.grupos.map(g=>`<label style="text-transform:none;letter-spacing:0;font-size:14px;color:var(--txt);margin:0"><input type="checkbox" class="g" value="${g.id}" ${meus.includes(g.id)?'checked':''} style="width:auto;margin-right:4px">${esc(g.nome)}</label>`).join('')}</div>
    <label style="text-transform:none;letter-spacing:0;font-size:14px;color:var(--txt);margin-top:14px"><input type="checkbox" id="at" ${a.ativo?'checked':''} style="width:auto;margin-right:8px">Ativo</label>
    <div class="row" style="margin-top:16px"><button class="btn" id="s" style="flex:1">Salvar</button><button class="btn sec" id="ind">Treinos individuais</button><button class="btn sec" id="prev">Ver como atleta</button></div></div>`;
  document.body.appendChild(md);
  md.querySelector('#x').onclick = () => md.remove();
  md.querySelector('#ind').onclick = () => { md.remove(); S.alvo = 'a:' + a.id; S.tab = 'cal'; render(); };
  md.querySelector('#prev').onclick = () => { md.remove(); S.preview = true; S.atleta = a; S.tab = 'hoje'; S.dia = hoje(); S.semana = segunda(hoje()); render(); };
  md.querySelector('#s').onclick = async () => {
    const upd = { nome: md.querySelector('#n').value.trim(), ativo: md.querySelector('#at').checked }; if (!a.user_id) upd.email = md.querySelector('#e').value.trim().toLowerCase() || null;
    const { error } = await sb.from('atletas').update(upd).eq('id', a.id); if (error) return erro(error);
    const novos = [...md.querySelectorAll('.g:checked')].map(c=>+c.value);
    const rm = meus.filter(g=>!novos.includes(g)), add = novos.filter(g=>!meus.includes(g));
    if (rm.length) { const r = await sb.from('grupo_atletas').delete().eq('atleta_id', a.id).in('grupo_id', rm); if (r.error) return erro(r.error); }
    if (add.length) { const r = await sb.from('grupo_atletas').insert(add.map(g=>({ grupo_id:g, atleta_id:a.id }))); if (r.error) return erro(r.error); }
    md.remove(); toast('Salvo'); vGrupos(m);
  };
}

iniciar();
</script>
